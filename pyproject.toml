[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rean"
version = "0.1.0"
description = "REAN package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "matplotlib",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["rean*"]
